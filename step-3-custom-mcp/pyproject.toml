[project]
name = "step-3-custom-mcp"
version = "1.0.0"
description = "GritAI · Agent SDK Workshop step 3 — custom in-process MCP server"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.2.87",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# This step doesn't ship as a wheel — single-file demo. Tell hatchling so explicitly
# so `uv sync` doesn't probe for a `src/` or package layout.
bypass-selection = true
