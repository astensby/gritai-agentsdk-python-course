[project]
name = "step-6-web-chat"
version = "1.0.0"
description = "GritAI · Agent SDK Workshop step 6 — web chat (FastAPI + SSE)"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk==0.2.152",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# This step doesn't ship as a wheel — it's a runnable FastAPI app. Tell hatchling
# so `uv sync` doesn't probe for a wheel layout.
bypass-selection = true
