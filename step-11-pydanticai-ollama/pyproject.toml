[project]
name = "step-11-pydanticai-ollama"
version = "1.0.0"
description = "GritAI · Agent SDK Workshop step 11 — same agent ideas via PydanticAI + local Ollama model"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.2.87",
    "pydantic-ai-slim[openai]>=0.0.14",
    "ollama>=0.4.0",
    "httpx>=0.27.0",
    "python-frontmatter>=1.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# This step doesn't ship as a wheel — single-file demo. Tell hatchling so explicitly
# so `uv sync` doesn't probe for a `src/` or package layout.
bypass-selection = true
