[project]
name = "step-3b-real-weather"
version = "1.0.0"
description = "GritAI · Agent SDK Workshop step 3b — custom MCP server calling a real weather API"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.2.87",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# This step doesn't ship as a wheel — single-file demo. Tell hatchling so explicitly
# so `uv sync` doesn't probe for a `src/` or package layout.
bypass-selection = true
