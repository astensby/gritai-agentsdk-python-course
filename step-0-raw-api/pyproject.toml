[project]
name = "step-0-raw-api"
version = "1.0.0"
description = "GritAI · Agent SDK Workshop step 0 — the raw Anthropic API, before the Agent SDK"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# This step doesn't ship as a wheel — single-file demo. Tell hatchling so explicitly
# so `uv sync` doesn't probe for a `src/` or package layout.
bypass-selection = true
