[project]
name = "step-1-hello-loop"
version = "1.0.0"
description = "GritAI · Agent SDK Workshop step 1 — the smallest possible query() call"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk==0.2.152",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# This step doesn't ship as a wheel — single-file demo. Tell hatchling so explicitly
# so `uv sync` doesn't probe for a `src/` or package layout.
bypass-selection = true
